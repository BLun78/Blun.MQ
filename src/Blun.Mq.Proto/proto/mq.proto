syntax = "proto3";

package blun.mq.v1;

// MqService is the client-facing API exposed by every node.
// A producer/consumer can connect to any node; for queues that are not
// yet backed by a per-partition Raft group, the node currently serving
// the request is authoritative for its own in-memory copy only.
service MqService {
  // Publish a single message to a queue on this node.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Consume streams messages from a queue on this node to the caller.
  // Messages are delivered at-least-once; the consumer sends an Ack
  // for each delivered message via the same stream.
  rpc Consume(stream ConsumeRequest) returns (stream ConsumeResponse);

  // Status returns the current message count for every known queue on
  // this node, then streams updates as they happen (server push).
  rpc WatchStatus(StatusRequest) returns (stream StatusUpdate);
}

message PublishRequest {
  string queue = 1;
  bytes payload = 2;
}

message PublishResponse {
  uint64 offset = 1;
}

message ConsumeRequest {
  oneof kind {
    Subscribe subscribe = 1;
    Ack ack = 2;
  }
}

message Subscribe {
  string queue = 1;
}

message Ack {
  uint64 offset = 1;
}

message ConsumeResponse {
  uint64 offset = 1;
  bytes payload = 2;
}

message StatusRequest {}

message StatusUpdate {
  string node_id = 1;
  map<string, uint64> queue_depths = 2;
  // Raft node id (0 = none elected yet) currently leading each of the
  // cluster's two Raft groups - see RaftGroup below.
  uint64 nodes_group_leader = 3;
  uint64 queue_group_leader = 4;
}

// RaftRpc carries openraft's internal AppendEntries/Vote/InstallSnapshot
// messages as opaque, serde-serialized envelopes between the 3 nodes.
// This crosses the same port as MqService (both are registered on the
// same tonic server), since a node's own address is also its Raft peer
// address.
//
// Each node actually runs two independent openraft::Raft instances, one
// per RaftGroup, each with its own leader/log/WAL:
//  - NODES: cluster membership/directory (which node ids exist and where
//    they're reachable). Small, low-churn, replicated for its own sake.
//  - SPAM: the "spam" queue's message data. High-churn, the actual
//    workload. Keeping it in its own Raft group (and its own WAL,
//    RaftEngineLogStore-backed at a separate directory) means queue
//    traffic never contends with or gets held up by membership churn,
//    and vice versa - a real benefit for a message-queue system where
//    the two have very different write patterns.
service RaftRpc {
  rpc AppendEntries(RaftEnvelope) returns (RaftEnvelope);
  rpc Vote(RaftEnvelope) returns (RaftEnvelope);
  rpc InstallSnapshot(RaftEnvelope) returns (RaftEnvelope);
}

enum RaftGroup {
  NODES = 0;
  SPAM = 1;
}

message RaftEnvelope {
  bytes payload = 1;
  RaftGroup group = 2;
}
